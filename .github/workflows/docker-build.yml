name: Build Docker Image

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lms-be-v2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for verification
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: lms-be-v2:ci
          cache-from: type=gha

      - name: Verify compiled backend artifacts
        run: |
          docker run --rm --entrypoint sh lms-be-v2:ci -lc '
            set -e
            test -f dist/main.js
            test -f dist/config/data-source.js
            migration_count="$(find dist/database/migrations -maxdepth 1 -name "*.js" | wc -l | tr -d " ")"
            if [ "$migration_count" -eq 0 ]; then
              echo "No compiled migrations found." >&2
              exit 1
            fi
          '

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
